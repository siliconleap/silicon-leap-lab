<!doctype html>
<meta charset="utf-8">
<meta name="render-size" content="1080x1440">
<title>1000 篇收藏换不来一次成长</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; background: #1a1a19; color: #f0eee6;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 84px 76px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .tag { font-size: 29px; color: #8a8780; letter-spacing: .18em; }
  .hook { font-size: 34px; color: #a8a49c; margin-top: 34px; line-height: 1.5; }
  h1 { font-size: 92px; line-height: 1.2; font-weight: 700; margin-top: 26px; }
  h1 em { font-style: normal; color: #d97757; }

  .beats { margin-top: 58px; display: flex; flex-direction: column; gap: 20px; }
  .beat { background: #0f0f0e; border-radius: 16px; padding: 30px 34px; display: flex; gap: 26px; align-items: flex-start; }
  .beat .k { font-size: 27px; color: #d97757; letter-spacing: .08em; white-space: nowrap; padding-top: 6px; min-width: 96px; }
  .beat .v { font-size: 33px; line-height: 1.55; }
  .beat .v span { color: #8a8780; }

  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .brand { font-size: 29px; color: #8a8780; letter-spacing: .1em; }
  .punch { text-align: right; font-size: 42px; font-weight: 700; line-height: 1.4; }
  .punch em { font-style: normal; color: #d97757; }
</style>
<body>
  <div>
    <div class="tag">硅基跃迁 · 实验记录 01</div>
    <div class="hook">收藏夹里躺着一堆「以后要做」。<br>真正动手的尝试却很少。</div>
    <h1>1000 篇收藏<br>换不来一次<em>成长</em></h1>

    <div class="beats">
      <div class="beat">
        <div class="k">半天</div>
        <div class="v">流水线骨架搭完了<br><span>skill、平台配置和模板都在</span></div>
      </div>
      <div class="beat">
        <div class="k">一周多</div>
        <div class="v">第一篇还是不想发<br><span>不是代码卡住，是初稿还不值得发布</span></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="brand">silicon-leap-lab</div>
    <div class="punch">做完一件<br><em>才算</em></div>
  </div>
</body>
