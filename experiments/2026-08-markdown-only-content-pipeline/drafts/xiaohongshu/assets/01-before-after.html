<!doctype html>
<meta charset="utf-8">
<meta name="render-size" content="1080x1440">
<title>同一事实，两种文案</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1440px; padding: 78px 64px; background: #1a1a19; color: #f0eee6; font-family: "PingFang SC", sans-serif; }
  h1 { font-size: 68px; line-height: 1.2; } h1 em { color: #d97757; font-style: normal; }
  .sub { margin-top: 24px; color: #a8a49c; font-size: 32px; line-height: 1.5; }
  .columns { display: flex; gap: 28px; margin-top: 62px; }
  .card { width: 50%; min-height: 720px; padding: 36px; border-radius: 20px; background: #0f0f0e; }
  .tag { font-size: 28px; letter-spacing: .12em; color: #d97757; } .card h2 { margin: 22px 0 32px; font-size: 44px; }
  .copy { font-size: 34px; line-height: 1.65; } .muted { color: #8a8780; }
  .rule { margin-top: 58px; border-top: 2px solid #35342f; padding-top: 36px; font-size: 37px; line-height: 1.55; }
  .rule b { color: #d97757; }
</style>
<body>
  <h1>同一事实，<em>两种文案</em></h1>
  <p class="sub">问题不在少了形容词，而在读者有没有立足点。</p>
  <div class="columns">
    <section class="card"><p class="tag">旧模板</p><h2>事实 + 列表</h2><p class="copy">流水线能跑。<br>平台工具依赖 0。<br><br><span class="muted">结果：<br>有效的：<br>踩的坑：</span></p></section>
    <section class="card"><p class="tag">改稿</p><h2>处境 + 反差</h2><p class="copy">半天搭完流水线。<br>第一篇却读不下去。<br><br>一周多过去，我还在改它，越来越不想发布。</p></section>
  </div>
  <p class="rule"><b>改的是叙事信息：</b>当时在做什么、以为什么、实际发生了什么。不是多加形容词。</p>
</body>
