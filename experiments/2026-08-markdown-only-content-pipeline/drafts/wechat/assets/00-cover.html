<!doctype html>
<meta charset="utf-8">
<meta name="render-size" content="900x500">
<title>公众号头条封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px; height: 500px; background: #1a1a19; color: #f0eee6;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 52px 56px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .tag { font-size: 20px; color: #8a8780; letter-spacing: .18em; }
  h1 { font-size: 62px; line-height: 1.18; font-weight: 700; margin-top: 20px; }
  h1 em { font-style: normal; color: #d97757; }
  .beats { display: flex; gap: 18px; margin-top: 26px; }
  .b { flex: 1; background: #0f0f0e; border-radius: 12px; padding: 20px 22px; }
  .b .k { font-size: 19px; color: #d97757; letter-spacing: .08em; }
  .b .v { font-size: 23px; line-height: 1.45; margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 20px; color: #8a8780; letter-spacing: .1em; }
  .punch { font-size: 26px; font-weight: 700; }
  .punch em { font-style: normal; color: #d97757; }
</style>
<body>
  <div>
    <div class="tag">硅基跃迁 · 实验记录 01</div>
    <h1>1000 篇收藏<br>换不来一次<em>成长</em></h1>
  </div>
  <div class="beats">
    <div class="b"><div class="k">半天</div><div class="v">流水线骨架搭完了</div></div>
    <div class="b"><div class="k">一周多</div><div class="v">第一篇还是不想发</div></div>
  </div>
  <div class="foot">
    <div class="brand">silicon-leap-lab</div>
    <div class="punch">做完一件<em>才算</em></div>
  </div>
</body>
