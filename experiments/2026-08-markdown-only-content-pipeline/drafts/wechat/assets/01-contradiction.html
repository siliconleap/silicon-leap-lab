<!doctype html>
<meta charset="utf-8">
<meta name="render-size" content="1080x608">
<title>配置与模板自相矛盾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 608px; background: #1a1a19; color: #f0eee6;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 44px 48px; display: flex; flex-direction: column; justify-content: space-between;
  }
  h2 { font-size: 38px; font-weight: 700; line-height: 1.3; }
  h2 em { font-style: normal; color: #d97757; }
  .cols { display: flex; gap: 22px; }
  .c { flex: 1; background: #0f0f0e; border-radius: 14px; padding: 24px 26px; }
  .c .path { font-family: "SF Mono", Menlo, monospace; font-size: 17px; color: #8a8780; }
  .c .role { font-size: 19px; color: #d97757; letter-spacing: .08em; margin: 12px 0 12px; }
  .c .body { font-size: 24px; line-height: 1.55; }
  .c.tpl .body { font-family: "SF Mono", Menlo, monospace; font-size: 21px; line-height: 1.95; }
  .c .body .dim { color: #a8a49c; }
  .verdict { border-top: 2px solid #35342f; padding-top: 20px; font-size: 25px; line-height: 1.5; color: #c9c6bd; }
  .verdict b { color: #f0eee6; }
</style>
<body>
  <h2>配置在批评模板，模板在<em>违反配置</em></h2>

  <div class="cols">
    <div class="c">
      <div class="path">platforms/xiaohongshu.md</div>
      <div class="role">配置说</div>
      <div class="body">「陈述完事实就转进列表。<span class="dim">没有处境，没有反应，数字没有参照系。</span>」</div>
    </div>
    <div class="c tpl">
      <div class="path">templates/xiaohongshu/note.md</div>
      <div class="role">模板写着</div>
      <div class="body">**结果：**<br>- &nbsp; - &nbsp; -<br>**有效的：**<br>- &nbsp; -<br>**踩的坑：**<br>- &nbsp; -</div>
    </div>
  </div>

  <div class="verdict">两个文件<b>分开看，每一个都是对的</b>。矛盾只在真的跑一遍、读到产出的那一刻才出现。</div>
</body>
