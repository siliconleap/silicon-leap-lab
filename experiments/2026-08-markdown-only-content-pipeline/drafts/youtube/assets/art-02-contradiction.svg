<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#1a1a19"/>

  <g filter="url(#rough2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左：配置文件，在批评 -->
    <g stroke="#c3c2b7" stroke-width="7">
      <path d="M300 220 h330 l70 78 v560 a16 16 0 0 1 -16 16 h-384 a16 16 0 0 1 -16 -16 v-622 a16 16 0 0 1 16 -16 z"/>
      <path d="M630 220 v78 h70"/>
    </g>
    <!-- 批评的话：波浪线代表叙事 -->
    <g stroke="#3987e5" stroke-width="5">
      <path d="M370 400 q40 -30 80 0 t80 0 t80 0"/>
      <path d="M370 470 q40 -30 80 0 t80 0 t60 0"/>
      <path d="M370 540 q40 -30 80 0 t80 0 t80 0"/>
    </g>
    <!-- 禁止列表的标记 -->
    <g stroke="#d03b3b" stroke-width="6">
      <circle cx="470" cy="680" r="58"/>
      <path d="M430 640 l80 80"/>
    </g>
    <g stroke="#898781" stroke-width="4">
      <path d="M440 668 h60"/><path d="M440 692 h60"/>
    </g>

    <!-- 右：模板文件，正在违反 -->
    <g stroke="#c3c2b7" stroke-width="7">
      <path d="M1220 220 h330 l70 78 v560 a16 16 0 0 1 -16 16 h-384 a16 16 0 0 1 -16 -16 v-622 a16 16 0 0 1 16 -16 z"/>
      <path d="M1550 220 v78 h70"/>
    </g>
    <!-- 三段硬编码列表 -->
    <g stroke="#d03b3b" stroke-width="5">
      <circle cx="1300" cy="410" r="9" fill="#d03b3b"/><path d="M1340 410 h230"/>
      <circle cx="1300" cy="490" r="9" fill="#d03b3b"/><path d="M1340 490 h190"/>
      <circle cx="1300" cy="570" r="9" fill="#d03b3b"/><path d="M1340 570 h250"/>
    </g>
    <g stroke="#898781" stroke-width="4">
      <path d="M1300 660 h270"/><path d="M1300 710 h210"/>
    </g>

    <!-- 中间：互相指责的两支箭 -->
    <g stroke="#fab219" stroke-width="7">
      <path d="M780 460 h340"/>
      <path d="M1080 424 l44 36 l-44 36"/>
      <path d="M1140 620 h-340"/>
      <path d="M840 584 l-44 36 l44 36"/>
    </g>
  </g>
</svg>
