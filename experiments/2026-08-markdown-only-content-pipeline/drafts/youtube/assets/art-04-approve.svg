    <g stroke="#c3c2b7" stroke-width="5">
      <path d="M980 250 h150 l38 42 v300 a10 10 0 0 1 -10 10 h-178 a10 10 0 0 1 -10 -10 v-332 a10 10 0 0 1 10 -10 z"/>
      <path d="M1130 250 v42 h38"/>
    </g>
    <g stroke="#0ca30c" stroke-width="4">
      <path d="M1010 348 h108"/><path d="M1010 396 h130"/><path d="M1010 444 h96"/><path d="M1010 492 h122"/>
    </g>
  </g>
  <text x="1075" y="700" font-family="-apple-system,'PingFang SC',sans-serif" font-size="30" fill="#898781" text-anchor="middle">分步流程 · 硬约束 · 验收标准</text>

  <!-- ============ 终端窗口：真实原话 ============ -->
  <g>
    <rect x="1250" y="292" width="590" height="256" rx="14" fill="#111110" stroke="#3a3a37" stroke-width="3"/>
    <rect x="1250" y="292" width="590" height="46" rx="14" fill="#232320"/>
    <rect x="1250" y="326" width="590" height="12" fill="#232320"/>
