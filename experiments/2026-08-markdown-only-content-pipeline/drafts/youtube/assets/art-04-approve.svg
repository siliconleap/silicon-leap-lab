  <text x="1545" y="880" font-family="-apple-system,'PingFang SC',sans-serif" font-size="30" fill="#c3c2b7" text-anchor="middle">一句话，批准</text>
  <text x="1545" y="928" font-family="-apple-system,'PingFang SC',sans-serif" font-size="26" fill="#d03b3b" text-anchor="middle">而我并不理解它内部怎么跑</text>
