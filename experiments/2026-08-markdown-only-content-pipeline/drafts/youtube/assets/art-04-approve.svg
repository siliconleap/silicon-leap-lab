    <text x="1520" y="322" font-family="'SF Mono',Menlo,monospace" font-size="20" fill="#898781" text-anchor="middle">2026-08-09 07:11:50</text>
    <text x="1284" y="404" font-family="'SF Mono',Menlo,monospace" font-size="27" fill="#0ca30c">›</text>
    <text x="1316" y="404" font-family="-apple-system,'PingFang SC',sans-serif" font-size="27" fill="#ffffff">可以，写出来，</text>
    <text x="1316" y="446" font-family="-apple-system,'PingFang SC',sans-serif" font-size="27" fill="#ffffff">后续软链我想办法建</text>
    <rect x="1316" y="476" width="15" height="28" fill="#3987e5"/>
  </g>

  <!-- ============ 人：一句话就批准了 ============ -->
  <g filter="url(#hand)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#c3c2b7" stroke-width="6">
    <circle cx="1545" cy="668" r="42"/>
    <path d="M1478 800 a67 67 0 0 1 134 0"/>
    <!-- 竖起大拇指 -->
    <path d="M1612 758 l44 -26"/>
    <path d="M1656 758 v-42 a16 16 0 0 1 32 0 v42 a12 12 0 0 1 -12 12 h-42 a12 12 0 0 1 -12 -12 v-14 z"/>
