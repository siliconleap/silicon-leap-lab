<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="hand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#1a1a19"/>

  <!-- ============ 左：散乱的输入 ============ -->
  <g filter="url(#hand)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#898781" stroke-width="4">
    <rect x="96" y="300" width="104" height="74" rx="7" transform="rotate(-13 148 337)"/>
    <rect x="228" y="248" width="92" height="66" rx="7" transform="rotate(8 274 281)"/>
    <rect x="112" y="452" width="98" height="70" rx="7" transform="rotate(5 161 487)"/>
    <rect x="236" y="430" width="86" height="62" rx="7" transform="rotate(-9 279 461)"/>
    <rect x="150" y="596" width="100" height="72" rx="7" transform="rotate(11 200 632)"/>
    <circle cx="330" cy="370" r="19"/>
    <circle cx="118" cy="590" r="15"/>
    <path d="M300 540 l44 -25 l44 25 l-44 25 z"/>
  </g>
  <text x="230" y="770" font-family="-apple-system,'PingFang SC',sans-serif" font-size="30" fill="#898781" text-anchor="middle">一句话选题 · 零散的想法</text>

  <!-- ============ AI 处理 ============ -->
  <g filter="url(#hand)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#3987e5" stroke-width="6">
      <path d="M420 470 h108"/><path d="M498 442 l38 28 l-38 28"/>
    </g>
    <!-- AI：芯片 -->
    <g stroke="#c3c2b7" stroke-width="6">
      <rect x="566" y="392" width="156" height="156" rx="16"/>
      <path d="M604 392 v-30"/><path d="M644 392 v-30"/><path d="M684 392 v-30"/>
      <path d="M604 548 v30"/><path d="M644 548 v30"/><path d="M684 548 v30"/>
      <path d="M566 430 h-30"/><path d="M566 470 h-30"/><path d="M566 510 h-30"/>
      <path d="M722 430 h30"/><path d="M722 470 h30"/><path d="M722 510 h30"/>
    </g>
    <g stroke="#3987e5" stroke-width="5">
      <path d="M624 452 l20 -26 l20 26 l26 18 l-26 18 l-20 26 l-20 -26 l-26 -18 z"/>
    </g>
    <g stroke="#3987e5" stroke-width="6">
      <path d="M760 470 h108"/><path d="M838 442 l38 28 l-38 28"/>
    </g>
  </g>
  <text x="644" y="640" font-family="-apple-system,'PingFang SC',sans-serif" font-size="30" fill="#898781" text-anchor="middle">半天</text>

  <!-- ============ 右：结构完整的产物 ============ -->
  <g filter="url(#hand)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后两张纸露在后面，构成一叠 -->
    <g stroke="#c3c2b7" stroke-width="5" opacity="0.28">
      <path d="M1024 306 h150 l38 42 v300 a10 10 0 0 1 -10 10 h-178 a10 10 0 0 1 -10 -10 v-332 a10 10 0 0 1 10 -10 z"/>
    </g>
    <g stroke="#c3c2b7" stroke-width="5" opacity="0.5">
      <path d="M1002 278 h150 l38 42 v300 a10 10 0 0 1 -10 10 h-178 a10 10 0 0 1 -10 -10 v-332 a10 10 0 0 1 10 -10 z"/>
