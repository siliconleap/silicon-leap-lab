<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#1a1a19"/>

  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 散落的想法碎片，未收拢 -->
    <g stroke="#898781" stroke-width="4">
      <rect x="300" y="250" width="120" height="86" rx="8" transform="rotate(-14 360 293)"/>
      <rect x="470" y="180" width="104" height="74" rx="8" transform="rotate(9 522 217)"/>
      <rect x="255" y="430" width="112" height="80" rx="8" transform="rotate(6 311 470)"/>
      <rect x="455" y="410" width="96" height="68" rx="8" transform="rotate(-8 503 444)"/>
      <rect x="330" y="610" width="118" height="84" rx="8" transform="rotate(12 389 652)"/>
      <circle cx="600" cy="330" r="26"/>
      <circle cx="250" cy="600" r="20"/>
      <path d="M560 540 l60 -34 l60 34 l-60 34 z"/>
    </g>

    <!-- 收拢的箭头 -->
    <g stroke="#3987e5" stroke-width="6">
      <path d="M700 420 C 850 420, 900 470, 1010 500"/>
      <path d="M962 468 l52 33 l-50 36"/>
    </g>

    <!-- 容器：一个实验目录 -->
    <g stroke="#c3c2b7" stroke-width="7">
      <path d="M1120 380 h300 l52 62 h288 v380 a18 18 0 0 1 -18 18 h-604 a18 18 0 0 1 -18 -18 z"/>
    </g>
    <g stroke="#3987e5" stroke-width="5">
      <path d="M1210 560 h420"/>
      <path d="M1210 640 h330"/>
      <path d="M1210 720 h380"/>
    </g>
    <!-- 容器上的封条：一次公开 -->
    <g stroke="#0ca30c" stroke-width="6">
      <path d="M1560 300 v96"/>
      <path d="M1524 356 l36 40 l40 -52"/>
    </g>
  </g>
</svg>
