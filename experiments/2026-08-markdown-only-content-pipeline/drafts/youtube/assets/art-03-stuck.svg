<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="rough3" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#1a1a19"/>

  <g filter="url(#rough3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左段：半天就跑完的部分 -->
    <g stroke="#0ca30c" stroke-width="9">
      <path d="M240 540 h420"/>
      <path d="M300 470 v140"/><path d="M420 470 v140"/><path d="M540 470 v140"/>
    </g>
    <g stroke="#898781" stroke-width="4">
      <path d="M240 660 h420"/>
      <path d="M240 640 v40"/><path d="M660 640 v40"/>
    </g>

    <!-- 中段：卡住的地方，来回打转 -->
    <g stroke="#fab219" stroke-width="9">
      <path d="M760 540 C 860 380, 1080 380, 1140 500"/>
      <path d="M1140 500 C 1180 620, 960 700, 860 620"/>
      <path d="M860 620 C 780 560, 820 470, 940 470"/>
      <path d="M912 436 l34 34 l-40 32"/>
    </g>
    <!-- 打转的圈数标记 -->
    <g stroke="#898781" stroke-width="4">
      <path d="M780 760 h380"/>
      <path d="M780 740 v40"/><path d="M1160 740 v40"/>
    </g>

    <!-- 右段：没走出去的那一步 -->
    <g stroke="#898781" stroke-width="9" stroke-dasharray="26 26">
      <path d="M1260 540 h420"/>
    </g>
    <!-- 终点：一直没按下的发布 -->
    <g stroke="#d03b3b" stroke-width="8">
      <circle cx="1720" cy="540" r="72"/>
      <path d="M1720 500 v56"/>
      <path d="M1686 512 a48 48 0 1 0 68 0"/>
    </g>
  </g>
</svg>
