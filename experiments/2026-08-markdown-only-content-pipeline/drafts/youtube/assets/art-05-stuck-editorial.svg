      <path d="M352 226 l36 34"/><path d="M388 226 l-36 34"/>
      <path d="M422 226 l36 34"/><path d="M458 226 l-36 34"/>
      <path d="M492 226 l36 34"/><path d="M528 226 l-36 34"/>
