  <!-- ═══════ 笔记本电脑 ═══════ -->
  <g filter="url(#ink2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 560 h330 v230 h-330 z" stroke="#b8b6a9" stroke-width="5"/>
    <path d="M582 790 h366 l16 14 h-398 z" stroke="#b8b6a9" stroke-width="5"/>
