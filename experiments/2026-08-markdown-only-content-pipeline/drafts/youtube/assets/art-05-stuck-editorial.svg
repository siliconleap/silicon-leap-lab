<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ink2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#14140f"/>

  <!-- ═══════ 远景：一扇开着的门，光从那里来 ═══════ -->
  <g filter="url(#ink2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1560 250 h250 v640 h-250 z" stroke="#6f6d66" stroke-width="4"/>
    <path d="M1600 288 h172 v564 h-172 z" stroke="#8d8b82" stroke-width="3"/>
    <!-- 门内的光：疏排线 -->
    <g stroke="#c9a24a" stroke-width="2.4" opacity="0.85">
      <path d="M1610 320 h152"/><path d="M1610 366 h152"/><path d="M1610 412 h152"/>
      <path d="M1610 458 h152"/><path d="M1610 504 h152"/><path d="M1610 550 h152"/>
      <path d="M1610 596 h152"/><path d="M1610 642 h152"/><path d="M1610 688 h152"/>
    </g>
    <circle cx="1588" cy="580" r="7" stroke="#8d8b82" stroke-width="3"/>
    <!-- 门口洒到地上的光 -->
    <path d="M1560 890 l-210 96 h460 z" stroke="#c9a24a" stroke-width="2.4" opacity="0.6"/>
  </g>

  <!-- ═══════ 通往门的路：走了一半就断了 ═══════ -->
