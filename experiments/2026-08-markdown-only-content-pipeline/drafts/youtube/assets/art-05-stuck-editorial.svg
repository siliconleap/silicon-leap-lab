  <!-- ═══════ 头顶打转的循环 ═══════ -->
  <g filter="url(#ink2)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#c9a24a" stroke-width="4">
    <path d="M300 350 C 260 286, 330 244, 400 262 C 470 280, 486 340, 434 366 C 386 390, 320 372, 306 330"/>
    <path d="M330 302 l-26 32 l-36 -20"/>
