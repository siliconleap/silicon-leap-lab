  <!-- ═══════ 图注 ═══════ -->
  <text x="960" y="1052" font-family="-apple-system,'PingFang SC',sans-serif" font-size="29" fill="#8d8b82" text-anchor="middle">骨架半天就搭完了 · 第一篇拖了一周多</text>
</svg>
