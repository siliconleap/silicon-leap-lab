  <!-- 屏幕内容：真实原话 -->
  <rect x="612" y="572" width="306" height="206" fill="#0e0e0a"/>
  <text x="632" y="614" font-family="'SF Mono',Menlo,monospace" font-size="17" fill="#7a7870">2026-08-15 15:22</text>
  <text x="632" y="662" font-family="-apple-system,'PingFang SC',sans-serif" font-size="23" fill="#ece9dd">越来越不肯行动</text>
  <text x="632" y="700" font-family="-apple-system,'PingFang SC',sans-serif" font-size="23" fill="#ece9dd">处于失败边缘</text>
  <g stroke="#c9a24a" stroke-width="2.5" fill="none">
    <path d="M632 726 h240"/>
  </g>
  <text x="632" y="760" font-family="-apple-system,'PingFang SC',sans-serif" font-size="19" fill="#7a7870">第 7 次改稿</text>

  <!-- ═══════ 人：塌肩、撑头，背对着门 ═══════ -->
  <g filter="url(#ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 头，微低 -->
    <path d="M372 470 a62 62 0 1 1 0.1 0" stroke="#e6e3d6" stroke-width="6"/>
