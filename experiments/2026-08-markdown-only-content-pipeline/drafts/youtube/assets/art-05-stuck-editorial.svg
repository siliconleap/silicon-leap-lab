      <path d="M490 852 l70 60"/><path d="M530 852 l70 60"/><path d="M570 852 l70 60"/>
      <path d="M610 852 l70 60"/><path d="M650 852 l70 60"/><path d="M690 852 l70 60"/>
      <path d="M730 852 l70 60"/><path d="M770 852 l70 60"/><path d="M810 852 l70 60"/>
