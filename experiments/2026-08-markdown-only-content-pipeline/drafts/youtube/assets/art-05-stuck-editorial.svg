    <g stroke="#7a7870" stroke-width="2">
      <path d="M336 580 q26 12 46 6"/><path d="M330 616 q30 14 52 6"/>
      <path d="M328 652 q32 14 56 6"/><path d="M330 688 q34 14 58 4"/>
      <path d="M334 724 q34 14 60 4"/>
    </g>
  </g>

  <!-- ═══════ 满地的废稿 ═══════ -->
  <g filter="url(#ink2)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#8d8b82">
    <g stroke-width="3.5">
      <path d="M180 940 q22 -34 54 -22 q30 -30 52 4 q28 26 -6 44 q-26 26 -56 8 q-34 6 -44 -34 z"/>
