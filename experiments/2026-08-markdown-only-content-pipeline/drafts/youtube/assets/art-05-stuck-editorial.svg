    <path d="M1450 917 h20" stroke="#7a7870" stroke-width="4" opacity="0.16"/>
  </g>

  <!-- ═══════ 墙上的日历：十天 ═══════ -->
  <g filter="url(#ink2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 128 h300 v212 h-300 z" stroke="#8d8b82" stroke-width="4"/>
    <path d="M250 182 h300" stroke="#8d8b82" stroke-width="4"/>
    <path d="M310 128 v-26" stroke="#8d8b82" stroke-width="4"/>
    <path d="M490 128 v-26" stroke="#8d8b82" stroke-width="4"/>
