    <g stroke-width="3">
      <path d="M636 1004 q16 -24 38 -16 q20 -20 36 4 q20 18 -6 32 q-18 16 -40 4 q-24 4 -28 -24 z"/>
    </g>
    <g stroke-width="3">
      <path d="M92 1010 q16 -24 38 -16 q20 -20 36 4 q20 18 -6 32 q-18 16 -40 4 q-24 4 -28 -24 z"/>
    </g>
    <g stroke-width="3" opacity="0.6">
      <path d="M810 992 q16 -24 38 -16 q20 -20 36 4 q20 18 -6 32 q-18 16 -40 4 q-24 4 -28 -24 z"/>
