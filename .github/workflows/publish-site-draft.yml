name: Publish Site Draft

on:
  workflow_dispatch:
    inputs:
      experiment_dir:
        description: Experiment directory, for example experiments/2026-08-markdown-only-content-pipeline
        required: true
        type: string
  push:
    paths:
      - 'experiments/**/README.md'
      - 'experiments/**/drafts/site/**'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: siliconleap/silicon-leap-site
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Select experiments
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.experiment_dir }}" > /tmp/site-experiments.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | awk -F/ '/^experiments\/[^/]+\// { print $1 "/" $2 }' \
              | sort -u > /tmp/site-experiments.txt
          fi

          if [ ! -s /tmp/site-experiments.txt ]; then
            echo "No experiment directories selected."
            exit 1
          fi

          cat /tmp/site-experiments.txt

      - name: Export site content
        run: |
          while IFS= read -r experiment_dir; do
            node scripts/export-site-content.mjs "$experiment_dir" site
          done < /tmp/site-experiments.txt

      - name: Validate site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run build

      - name: Create site pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          base: main
          branch: content/lab-${{ github.run_id }}
          delete-branch: true
          commit-message: Publish site draft from silicon-leap-lab
          title: Publish site draft from silicon-leap-lab
          body: |
            Generated from siliconleap/silicon-leap-lab.

            After this PR branch is pushed, silicon-leap-site deploys it to a Cloudflare Pages preview URL. Merge after reviewing the preview.
